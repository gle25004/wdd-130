<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <h2>Favorite BYU-I Devotionals</h2>

        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Elder Gerrit W. Gong</td>
            <td>The Lilies of the Field</td>
            <td>BYU-Idaho Center</td>
            <td>2024</td>
          </tr>
          <tr>
            <td>Mindy Harris</td>
            <td>Finding Joy in the Journey</td>
            <td>BYU-Idaho Center</td>
            <td>2024</td>
          </tr>
          <tr>
            <td>Paul W. Lambert</td>
            <td>Go Forth with Faith</td>
            <td>BYU-Idaho Center</td>
            <td>2024</td>
          </tr>
        </table>

        <h2>Add a Devotional</h2>
        <form>
          <label for="speaker">Speaker:</label>
          <input type="text" id="speaker" name="speaker">
          <br><br>
          <label for="title">Title:</label>
          <input type="text" id="title" name="title">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
