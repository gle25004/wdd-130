<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>
    <style>
        body {
            margin: 0;
            background-color: rgb(120, 96, 64);
            font-family: "Times New Roman", serif;
        }

        #formContainer {
            width: 400px;
            max-width: 90%;
            margin: 20px auto;
            background-color: white;
            border: 10px solid #0a2d78;
            border-radius: 30px;
            overflow: hidden;
        }

        header {
            height: 170px;
            background-image: url("images/jesus_feeds_5000.jpeg");
            background-size: cover;
            background-position: center;
            text-align: center;
            position: relative;
            color: white;
        }

        header h1 {
            margin: 0;
            padding-top: 75px;
            font-size: 32px;
            line-height: 1;
            text-shadow: 2px 2px black;
        }

        #closeBtn {
            position: absolute;
            top: 10px;
            left: 12px;
        }

        h3 {
            text-align: center;
            margin: 20px 0;
        }

        #myForm {
            display: grid;
            grid-template-columns: 1fr 170px;
            gap: 18px 10px;
            padding: 0 20px 20px;
            align-items: center;
        }

        #myForm input[type="text"],
        #myForm input[type="password"],
        #myForm input[type="email"] {
            width: 100%;
            box-sizing: border-box;
        }

        .check,
        .submit {
            grid-column: 1 / 3;
            text-align: center;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            background-color: white;
        }

        .books img {
            display: block;
            width: 100%;
            height: 100px;
            object-fit: cover;
            background-color: black;
        }

        #output:not(:empty) {
            background-color: white;
            max-width: 400px;
            margin: 15px auto;
            padding: 10px;
        }

        @media (max-width: 450px) {
            #myForm {
                grid-template-columns: 1fr;
            }

            .check,
            .submit {
                grid-column: 1;
            }

            #myForm input[type="text"],
            #myForm input[type="password"],
            #myForm input[type="email"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="formContainer">
        <header>
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed<br>Scripture a Day</h1>
        </header>

        <h3>Sign Up for Daily Scripture Feed</h3>

        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section class="check">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section class="check">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section class="submit">
                <button type="submit">Submit</button>
            </section>
        </form>

        <div class="books">
            <img src="images/old_testament.webp" alt="Old Testament">
            <img src="images/new_testament.webp" alt="New Testament">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>
</body>
</html>
